# Netlify builds the web app in web/ with no extra settings.
# The build reads the agents, skills, knowledge folders and docs from this repo
# (web/scripts/build-team.mjs), so redeploy after you change them.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
